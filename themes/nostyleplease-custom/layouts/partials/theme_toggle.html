<button class="theme-toggle" type="button" aria-label="Toggle color theme">
    <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 1.5v2.5M12 20v2.5M4.22 4.22l1.77 1.77M18.01 18.01l1.77 1.77M1.5 12h2.5M20 12h2.5M4.22 19.78l1.77-1.77M18.01 5.99l1.77-1.77" />
    </svg>
</button>
{{- /* Runs before the page content is parsed, so a saved theme applies without a flash. */}}
<script>
    (function () {
        var body = document.body;
        var button = document.currentScript.previousElementSibling;
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)");

        try {
            var saved = localStorage.getItem("theme");
            if (saved === "light" || saved === "dark") body.setAttribute("a", saved);
        } catch (e) {}

        function current() {
            var a = body.getAttribute("a");
            if (a === "light" || a === "dark") return a;
            return systemDark.matches ? "dark" : "light";
        }

        function updateLabel() {
            var next = current() === "dark" ? "light" : "dark";
            button.setAttribute("aria-label", "Switch to " + next + " mode");
            button.title = "Switch to " + next + " mode";
        }

        button.addEventListener("click", function () {
            var next = current() === "dark" ? "light" : "dark";
            body.setAttribute("a", next);
            try { localStorage.setItem("theme", next); } catch (e) {}
            updateLabel();
        });

        if (systemDark.addEventListener) systemDark.addEventListener("change", updateLabel);
        updateLabel();
    })();
</script>
